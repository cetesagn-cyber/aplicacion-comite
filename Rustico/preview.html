<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rústico — README Preview</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 40px 20px 80px;
    }
    .markdown-body {
      max-width: 980px;
      margin: 0 auto;
      padding: 45px 60px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
    }
    .markdown-body img {
      max-width: 100%;
      border-radius: 4px;
    }
    .markdown-body details {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      margin: 8px 0;
    }
    .markdown-body details summary {
      cursor: pointer;
      padding: 4px 0;
      font-weight: 600;
    }
    .markdown-body details[open] summary {
      margin-bottom: 12px;
    }
    .markdown-body code {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 85%;
    }
    .markdown-body pre code {
      background: transparent;
      border: none;
      padding: 0;
      font-size: 90%;
    }
    .markdown-body pre {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      overflow: auto;
    }
    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid #30363d;
      padding: 8px 16px;
    }
    .markdown-body th {
      background: #161b22;
    }
    .markdown-body tr:nth-child(even) {
      background: #161b22;
    }
    .markdown-body blockquote {
      border-left: 3px solid #2B5741;
      padding-left: 16px;
      color: #8b949e;
    }
    .markdown-body hr {
      border: none;
      border-top: 1px solid #30363d;
      margin: 28px 0;
    }
    .topbar {
      max-width: 980px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #8b949e;
      font-size: 13px;
    }
    .topbar span {
      color: #2B5741;
      font-weight: 600;
    }
    #loading {
      color: #8b949e;
      text-align: center;
      padding: 60px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span>RÚSTICO</span> · Barber & Concept Shop · README preview
  </div>
  <div class="markdown-body" id="content">
    <div id="loading">Cargando preview...</div>
  </div>

  <script>
    marked.setOptions({ breaks: true, gfm: true });

    fetch('./README.md')
      .then(r => {
        if (!r.ok) throw new Error('No se pudo cargar README.md');
        return r.text();
      })
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('content').innerHTML =
          '<p style="color:#f85149">Error: ' + err.message + '</p>';
      });
  </script>
</body>
</html>
